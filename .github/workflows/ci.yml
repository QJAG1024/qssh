name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # -- Build & Test -- every push/PR --
  check:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"
          check-latest: false
          cache: false

      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...

  # -- Release: build binaries (matrix) --
  build-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: ""
          - os: linux
            arch: arm64
            suffix: ""
          - os: darwin
            arch: amd64
            suffix: ""
          - os: darwin
            arch: arm64
            suffix: ""
          - os: windows
            arch: amd64
            suffix: .exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"
          check-latest: false
          cache: false

      - name: Build
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          CGO_ENABLED=0 \
          go build -ldflags="-s -w -X 'main.version=$(git describe --tags --always)'" -o qssh_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.suffix }} .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qssh_${{ matrix.os }}_${{ matrix.arch }}
          path: qssh_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.suffix }}

  # -- Release: create release + upload all assets (single run) --
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - run: ls -R artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" --generate-notes artifacts/**/*
